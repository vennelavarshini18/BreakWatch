<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BreakWatch</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --ink: #183153;
        --muted: #526985;
        --line: #dfe9f5;
        --accent: #0c7b5c;
        --warning: #d97706;
        --danger: #b91c1c;
        --neutral: #64748b;
        --low: #16a34a;
        --watch: #f59e0b;
        --high: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--ink); }
      body { padding: 18px; }
      .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 18px rgba(15,23,42,.04); }
      .sidebar { padding: 18px; }
      .main { padding: 18px; }
      h1 { margin: 0 0 16px; font-size: 2rem; }
      .form-grid { display: grid; gap: 12px; }
      label { display: grid; gap: 6px; font-size: 0.9rem; color: var(--muted); }
      input, select, textarea, button { width: 100%; border-radius: 10px; border: 1px solid var(--line); padding: 10px 12px; font-size: 0.95rem; }
      button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: 700; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #map { height: 260px; width: 100%; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .meta { margin-top: 12px; font-size: 0.82rem; color: var(--muted); }
      .status-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
      .badge, .banner, .chip, .citation-chip {
        display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 10px; font-size: 0.76rem; font-weight: 700; border: 1px solid transparent;
      }
      .badge { background: #e8f3ee; color: var(--accent); }
      .badge.watch { background: #fff7ed; color: var(--watch); }
      .badge.high { background: #fef2f2; color: var(--high); }
      .badge.low { background: #ecfdf5; color: var(--low); }
      .badge.insufficient { background: #f1f5f9; color: var(--neutral); }
      .banner { width: fit-content; max-width: 100%; border-radius: 10px; padding: 8px 10px; font-size: 0.78rem; }
      .banner.info { background: #eef6ff; color: #1d4ed8; }
      .banner.warn { background: #fff7ed; color: var(--warning); }
      .banner.alert { background: #fef2f2; color: var(--danger); }
      .banner.ok { background: #ecfdf5; color: var(--accent); }
      .section { margin-top: 18px; }
      .section h2 { margin: 0 0 12px; font-size: 1.1rem; }
      .gauge-shell { display: flex; align-items: center; gap: 20px; }
      .gauge-ring {
        width: 125px; height: 125px; border-radius: 50%; position: relative; background: conic-gradient(var(--accent) 0deg 0deg, #e5e7eb 0deg 360deg);
        display: grid; place-items: center;
      }
      .gauge-ring::before {
        content: ""; position: absolute; inset: 12px; border-radius: 50%; background: white; box-shadow: inset 0 0 0 1px var(--line);
      }
      .gauge-value { position: relative; z-index: 1; font-weight: 800; font-size: 1.3rem; }
      .gauge-value small { display: block; text-align: center; font-size: 0.62rem; color: var(--muted); }
      .chart-wrap { height: 220px; }
      .chip-row, .citation-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { background: #eff6ff; color: #1d4ed8; border-color: #dbeafe; }
      .chip.experimental { background: #fff7ed; color: #b45309; border-color: #fed7aa; }
      .citation-chip { background: #f8fafc; color: var(--ink); border-color: var(--line); cursor: pointer; }
      .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
      .list li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fafcff; }
      .list small { display: block; color: var(--muted); margin-top: 6px; }
      .empty { color: var(--muted); font-size: 0.9rem; }
      .hidden { display: none !important; }
      .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: none; align-items: center; justify-content: center; padding: 20px; }
      .modal.visible { display: flex; }
      .modal-card { background: white; border-radius: 16px; width: min(700px, 90vw); max-height: 82vh; overflow: auto; padding: 20px; border: 1px solid var(--line); }
      .close-btn { float: right; border: none; background: transparent; font-size: 1.4rem; cursor: pointer; color: var(--muted); }
      .muted { color: var(--muted); }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel sidebar">
        <h1>BreakWatch</h1>
        <div class="form-grid">
          <div id="map" aria-label="Field map"></div>
          <label>
            As of date
            <input id="asOfInput" type="date" />
          </label>
          <label>
            Crop
            <select id="cropInput">
              <option value="">Select crop</option>
              <option value="cotton">Cotton</option>
              <option value="maize">Maize</option>
              <option value="paddy">Paddy</option>
              <option value="redgram">Redgram</option>
            </select>
          </label>
          <label>
            Soil
            <select id="soilInput">
              <option value="">Select soil</option>
              <option value="red_sandy">Red sandy</option>
              <option value="black_clay">Black clay</option>
              <option value="loam">Loam</option>
            </select>
          </label>
          <label>
            Irrigation budget (mm)
            <input id="irrigationInput" type="number" min="0" step="0.1" value="0" />
          </label>
          <label id="polygonFallback" class="hidden">
            Field polygon (GeoJSON)
            <textarea id="polygonInput" rows="4" placeholder='{"type":"Polygon","coordinates":[[[78,17],[78.1,17],[78.1,17.1],[78,17.1],[78,17]]]}'>
            </textarea>
          </label>
          <button id="analyzeBtn" type="button">Analyze</button>
        </div>
        <div class="meta" id="formMeta">Draw a field polygon to begin.</div>
      </aside>

      <main class="panel main">
        <div id="runError" class="banner alert hidden" role="alert"></div>
        <div id="dataWarning" class="banner warn hidden" role="status"></div>
        <div class="status-row" id="statusRow"></div>

        <section class="section">
          <h2>Field stress</h2>
          <div class="gauge-shell">
            <div class="gauge-ring" id="gaugeRing">
              <div class="gauge-value" id="gaugeValue">--<small>stress</small></div>
            </div>
            <div>
              <div id="gaugeLabel" class="muted">Insufficient data</div>
              <div id="gaugeConfidence" class="muted"></div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Forecast</h2>
          <div id="forecastPanel" class="empty">Awaiting forecast output.</div>
        </section>

        <section class="section">
          <h2>Weather</h2>
          <div id="weatherChart" class="chart-wrap empty">No weather data available.</div>
        </section>

        <section class="section">
          <h2>Soil moisture</h2>
          <div id="soilSummary" class="empty">No soil-moisture benchmark available.</div>
        </section>

        <section class="section">
          <h2>Triggers</h2>
          <ul id="triggerList" class="list"></ul>
        </section>

        <section class="section">
          <h2>Advisory</h2>
          <div id="advisoryList" class="list"></div>
        </section>

        <section class="section">
          <h2>Sources</h2>
          <div id="sourceChips" class="chip-row"></div>
        </section>

        <section class="section">
          <h2>Evidence / event banners</h2>
          <div id="eventBanners"></div>
        </section>
      </main>
    </div>

    <div id="citationModal" class="modal" aria-modal="true" role="dialog">
      <div class="modal-card">
        <button class="close-btn" type="button" id="closeCitationModal">×</button>
        <h3 id="citationTitle">ICAR citation</h3>
        <div id="citationBody" class="muted"></div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="./app.js?v=4"></script>
  </body>
</html>
